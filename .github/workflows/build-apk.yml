name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease || echo "Release build failed, likely missing signing credentials. Skipping release artifact."

      - name: Upload Debug APK (Ready to Install)
        uses: actions/upload-artifact@v4
        with:
          name: DrClicker-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DrClicker-Release-Unsigned-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
